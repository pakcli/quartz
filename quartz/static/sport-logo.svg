<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="88" height="88" fill="none">
  <!-- Athletic Shield / Arena Crest -->
  <path d="M50 10 L78 22 C78 52 64 78 50 90 C36 78 22 52 22 22 Z" 
        stroke="var(--dark, #0f172a)" stroke-width="3" stroke-linejoin="round" fill="none"/>
  
  <!-- Outer Theme Ring -->
  <path d="M50 16 L72 26 C72 50 60 72 50 82 C40 72 28 50 28 26 Z" 
        stroke="var(--tertiary, #2563eb)" stroke-width="1.8" stroke-dasharray="3 2" fill="none" opacity="0.6"/>
  
  <!-- Victory Torch / Flame -->
  <path d="M42 42 C42 42 46 32 50 24 C54 32 58 42 58 42 C55 45 45 45 42 42 Z" 
        fill="url(#sport-flame-grad)"/>
  <path d="M46 38 C46 38 48 32 50 28 C52 32 54 38 54 38 Z" 
        fill="var(--light, #ffffff)" opacity="0.8"/>
        
  <!-- Torch Handle / Wings -->
  <path d="M46 45 L54 45 L52 66 L48 66 Z" 
        fill="var(--secondary, #dc2626)"/>
  <path d="M44 48 L56 48" 
        stroke="var(--dark, #0f172a)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Star of Excellence -->
  <polygon points="50,70 52,74 56,74 53,76 54,80 50,77 46,80 47,76 44,74 48,74" 
           fill="var(--tertiary, #2563eb)"/>

  <defs>
    <linearGradient id="sport-flame-grad" x1="50" y1="24" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--secondary, #dc2626)"/>
      <stop offset="100%" stop-color="var(--tertiary, #2563eb)"/>
    </linearGradient>
  </defs>
</svg>