<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="88" height="88" fill="none">
  <!-- Outer orbital ring in theme colors -->
  <ellipse cx="50" cy="50" rx="42" ry="18" stroke="var(--secondary, #059669)" stroke-width="2.5" stroke-dasharray="4 2" transform="rotate(-30 50 50)" opacity="0.6"/>
  <ellipse cx="50" cy="50" rx="42" ry="18" stroke="var(--tertiary, #10b981)" stroke-width="2.5" stroke-dasharray="4 2" transform="rotate(30 50 50)" opacity="0.6"/>
  
  <!-- Modern Erlenmeyer Flask Body -->
  <path d="M44 14 L56 14 M47 14 L47 32 L22 76 C19 82 23 88 30 88 L70 88 C77 88 81 82 78 76 L53 32 L53 14" 
        stroke="var(--dark, #2b2b2b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Liquid Level with theme gradient -->
  <path d="M30 62 C38 59 44 65 52 61 C60 57 66 63 70 62 L74 72 C77 78 74 84 68 84 L32 84 C26 84 23 78 26 72 Z" 
        fill="url(#chem-liquid-grad)" opacity="0.85"/>
  
  <!-- Chemical Solution Bubbles -->
  <circle cx="42" cy="74" r="3" fill="var(--light, #ffffff)" opacity="0.8"/>
  <circle cx="56" cy="70" r="2" fill="var(--light, #ffffff)" opacity="0.8"/>
  <circle cx="49" cy="52" r="2.5" fill="var(--secondary, #059669)" opacity="0.7"/>
  <circle cx="53" cy="42" r="1.8" fill="var(--tertiary, #10b981)" opacity="0.7"/>

  <!-- Nucleus / Molecule spark -->
  <circle cx="50" cy="20" r="2.5" fill="var(--secondary, #059669)"/>

  <defs>
    <linearGradient id="chem-liquid-grad" x1="50" y1="58" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--tertiary, #10b981)"/>
      <stop offset="100%" stop-color="var(--secondary, #059669)"/>
    </linearGradient>
  </defs>
</svg>